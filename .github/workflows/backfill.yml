name: Обучение по истории

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backfill.py
      - name: Сохранить данные
        run: |
          git config user.name "pulse-sniper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Обучение по истории"
          git pull --rebase -X theirs
          git push
