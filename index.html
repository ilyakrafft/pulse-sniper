<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Pulse Sniper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: три раздела (Глобус, Сигналы, Отчёт) и плавающая навигация внизу.
   Смелое решение одно: столбики температуры на глобусе. Остальное спокойное. */
:root {
  --bg: #f4f4f6;
  --surface: #ffffff;
  --surface-2: #ececf0;
  --line: #d9dae1;
  --fg: #14151a;
  --muted: #626575;
  --accent: #e5501b;
  --accent-ink: #ffffff;
  --good: #12805a;
  --warn: #a96300;
  --bad: #c42f2a;
  --g-fill: #e9e9ee;
  --g-dot: #b4b6c2;
  --g-line: #d3d4dc;
  --g-glow: #ff7a3d;
  --shadow: 0 1px 0 rgba(20,21,26,.04), 0 12px 32px rgba(60,40,30,.12);
  --g1: #ff8a3d;
  --g2: #e5322d;
  --cy: #c2410c;
  --orb: .14;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090c; --surface: #141519; --surface-2: #1d1f25; --line: #2a2c35;
    --fg: #f4f2f0; --muted: #9a9ca8; --accent: #ff6a2b; --accent-ink: #160a04;
    --good: #3ddc97; --warn: #ffc15a; --bad: #ff5d5d;
    --g-fill: #0f1014; --g-dot: #3b3e4a; --g-line: #22242c; --g-glow: #ff5a1f;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 14px 36px rgba(0,0,0,.55);
    --g1: #ff9a3c; --g2: #e5322d; --cy: #ffb26b; --orb: .26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090c; --surface: #141519; --surface-2: #1d1f25; --line: #2a2c35;
  --fg: #f4f2f0; --muted: #9a9ca8; --accent: #ff6a2b; --accent-ink: #160a04;
  --good: #3ddc97; --warn: #ffc15a; --bad: #ff5d5d;
  --g-fill: #0f1014; --g-dot: #3b3e4a; --g-line: #22242c; --g-glow: #ff5a1f;
  --shadow: 0 1px 0 rgba(255,255,255,.03), 0 14px 36px rgba(0,0,0,.55);
  --g1: #ff9a3c; --g2: #e5322d; --cy: #ffb26b; --orb: .26;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-block: 12px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; }
.muted { color: var(--muted); }

@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 45%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
@keyframes sheen { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
.view { animation: viewIn .38s cubic-bezier(.2,.8,.2,1); }
.rise { animation: rise .55s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 50ms); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: .01em; }
.brand p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.25; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 12px; font-family: var(--f-mono); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); color: var(--warn); animation: pulse 2.4s infinite; }
.pill[data-on="1"] i { background: var(--good); color: var(--good); }

.app { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) {
  .app { grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .stage { position: sticky; top: 16px; }
}
.stage { position: relative; border-radius: 22px; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, var(--surface) 0%, var(--bg) 78%); border: 1px solid var(--line); }
#globe { height: clamp(320px, 50vh, 460px); }
@media (min-width: 900px) { #globe { height: min(74vh, 700px); } }
#globe canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.glabel { position: absolute; left: 0; top: 0; padding: 3px 9px 4px; border-radius: 8px; background: var(--surface); border: 1px solid var(--accent); font-size: 12px; font-weight: 600; white-space: nowrap; transition: opacity .2s; will-change: transform; box-shadow: var(--shadow); }
.glabel b { font-family: var(--f-mono); font-weight: 500; color: var(--muted); margin-left: 6px; }
.legend { position: absolute; left: 14px; bottom: 12px; display: grid; gap: 4px; width: 132px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.legend .bar { height: 6px; border-radius: 3px; }
.legend div:last-child { display: flex; justify-content: space-between; }
.hint { position: absolute; right: 14px; bottom: 12px; font-size: 11px; color: var(--muted); }
.nogl { margin: 0; padding: 40px 20px; color: var(--muted); }

.panel { display: grid; gap: 14px; min-width: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; transition: border-color .2s, background .2s, transform .15s; }
.chip:active { transform: scale(.96); }
.chip i { width: 9px; height: 9px; border-radius: 50%; }
.chip span { font-family: var(--f-mono); color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; }
.head { display: grid; gap: 4px; }
.kick { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.head h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 5vw, 30px); line-height: 1.15; text-wrap: balance; }
.big { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 14px; margin-top: 6px; }
.big strong { font-family: var(--f-display); font-weight: 500; font-size: clamp(40px, 10vw, 56px); line-height: 1; font-variant-numeric: tabular-nums; }
.big .range { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.swatch { height: 4px; border-radius: 2px; margin-top: 10px; transform-origin: left; animation: grow .7s cubic-bezier(.2,.8,.2,1); }

.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { display: grid; gap: 2px; justify-items: center; padding: 8px 2px 7px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); transition: border-color .2s, background .2s, transform .15s; }
.day:active { transform: scale(.95); }
.day small { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.day b { font-family: var(--f-mono); font-weight: 500; font-size: 14px; }
.day .conf { width: 70%; height: 3px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-top: 3px; }
.day .conf em { display: block; height: 100%; background: var(--accent); transform-origin: left; animation: grow .6s cubic-bezier(.2,.8,.2,1); }
.day[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); }

.card h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.card .sub { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .bar { fill: var(--surface-2); transform-box: fill-box; transform-origin: bottom; animation: growY .6s cubic-bezier(.2,.8,.2,1) backwards; }
.chart .bar.in { fill: var(--accent); }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; }
.chart text.pc { fill: var(--fg); }
.chart text.tot { fill: var(--fg); font-size: 12px; font-weight: 500; }
.chart .brk { stroke: var(--accent); stroke-width: 1.5; fill: none; }
.chart .axis, .chart .grid { stroke: var(--line); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; animation: draw 1.2s cubic-bezier(.3,.7,.2,1); }
.chart .area { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }

.models { display: grid; gap: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1.1fr) 56px minmax(0, 1.4fr); align-items: center; gap: 10px; }
.mrow .nm { font-size: 13px; font-weight: 500; }
.mrow .nm small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
.mrow .vl { font-family: var(--f-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 18px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--surface-2); border-radius: 1px; }
.track .mean { position: absolute; top: 2px; bottom: 2px; left: 50%; width: 2px; background: var(--muted); opacity: .6; }
.track .dot { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); transition: left .6s cubic-bezier(.3,1.2,.4,1); }

.badge { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
.badge i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.strong { color: var(--good); } .badge.mid { color: var(--warn); } .badge.weak { color: var(--bad); }
.badge.strong i { animation: pulse 2.2s infinite; }
.signal { display: grid; gap: 8px; }
.signal .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.signal p { margin: 0; color: var(--muted); font-size: 13px; }
.pct { font-family: var(--f-display); font-weight: 500; font-size: 26px; font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 16px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; text-decoration: none; position: relative; overflow: hidden; transition: transform .15s; }
.btn:active { transform: translateY(1px) scale(.99); }
.btn.sm { width: auto; padding: 9px 14px; font-size: 13px; border-radius: 12px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.shine::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); animation: sheen 3.2s infinite; }
.note { margin: 0; color: var(--muted); font-size: 12px; }

.lockbox { position: relative; overflow: hidden; }
.lockbox .ph { filter: blur(7px); opacity: .5; pointer-events: none; user-select: none; }
.lockcta { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; text-align: center; padding: 12px; }
.lockcta svg { color: var(--accent); }
.lockcta p { margin: 0; font-size: 13px; font-weight: 600; max-width: 26ch; }
.phbar { height: 14px; border-radius: 7px; background: var(--surface-2); }

.view-head { display: grid; gap: 4px; margin-bottom: 14px; }
.view-head h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 5vw, 30px); text-wrap: balance; }
.view-head p { margin: 0; color: var(--muted); max-width: 62ch; }
.demo { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 14px; border: 1px dashed var(--warn); color: var(--warn); font-size: 13px; margin-bottom: 14px; }
.demo b { font-family: var(--f-mono); font-weight: 500; flex: none; }
.access { display: grid; gap: 14px; margin-bottom: 14px; }
.access h2 { margin: 2px 0 4px; font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 4.6vw, 26px); text-wrap: balance; }
.access p { margin: 0; color: var(--muted); max-width: 60ch; }
.access .acts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.access.member { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.sig { display: grid; gap: 12px; align-content: start; }
.sig-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sig-top b { font-family: var(--f-display); font-weight: 500; font-size: 18px; display: block; }
.sig-top small { color: var(--muted); font-size: 12px; }
.pick { font-size: 13px; color: var(--muted); }
.pick strong { font-family: var(--f-display); font-weight: 500; color: var(--fg); font-size: 22px; margin-left: 6px; }
.vs { display: grid; gap: 8px; }
.vrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 42px; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
.vrow b { font-family: var(--f-mono); font-weight: 500; color: var(--fg); text-align: right; }
.vbar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.vbar em { display: block; height: 100%; width: var(--w); background: var(--accent); border-radius: 4px; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 50ms + .15s); }
.vrow.mkt .vbar em { background: var(--muted); }
.sig-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.edge { font-family: var(--f-mono); font-weight: 500; color: var(--good); font-size: 13px; }
.sig-foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 14px; }
.tile { padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 2px; }
.tile small { color: var(--muted); font-size: 12px; }
.tile strong { font-family: var(--f-display); font-weight: 500; font-size: 28px; font-variant-numeric: tabular-nums; }
.seg { display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 14px; }
.seg button { padding: 6px 14px; border: 0; border-radius: 9px; background: none; font-size: 13px; color: var(--muted); font-weight: 600; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); margin-bottom: 14px; }
.cal { display: grid; gap: 14px; }
.calrow { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 12px; color: var(--muted); }
.calbars { display: grid; gap: 5px; }
.calbars .vrow { grid-template-columns: 56px minmax(0, 1fr) 38px; }
.res { display: grid; gap: 0; }
.rrow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); font-size: 13px; }
.rrow:first-child { border-top: 0; }
.rrow b { font-weight: 600; display: block; }
.rrow small { color: var(--muted); font-size: 11.5px; }
.rrow .num { font-family: var(--f-mono); font-size: 12.5px; }
.ok, .miss { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-weight: 700; font-size: 14px; }
.ok { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.miss { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }

.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(480px, calc(100% - 32px)); display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px; background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); z-index: 15; }
.dock button { position: relative; z-index: 1; background: none; border: 0; padding: 9px 4px 8px; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); transition: color .25s; }
.dock button[aria-current="page"] { color: var(--accent-ink); }
.dock .ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 4); border-radius: 16px; background: var(--accent); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .4s cubic-bezier(.3,1.15,.4,1); }
.dock { --i: 0; }
#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--fg); color: var(--bg); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Pulse Sniper: оформление терминала ---------- */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
@keyframes gridMove { to { background-position: 0 44px, 44px 0; } }
@keyframes marquee { to { transform: translateX(-50%); } }
@keyframes pop { from { opacity: .2; transform: scale(.92); } }
@keyframes gauge { from { stroke-dashoffset: 1; } }
@keyframes lock { from { transform: scale(2.6) rotate(-120deg); opacity: 0; } 55% { opacity: 1; } }
@keyframes introH { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 70% { opacity: 1; transform: translateY(42vh); } 100% { opacity: 0; transform: translateY(42vh); } }
@keyframes introV { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: 1; } 70% { opacity: 1; transform: translateX(50vw); } 100% { opacity: 0; transform: translateX(50vw); } }
@keyframes introR { 0% { opacity: 0; transform: scale(2.2); } 40% { opacity: .9; } 100% { opacity: 0; transform: scale(.1); } }

.wrap { position: relative; z-index: 1; }
.bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bgfx::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 44px 44px; opacity: .38; -webkit-mask-image: radial-gradient(70% 55% at 50% 18%, #000, transparent 80%); mask-image: radial-gradient(70% 55% at 50% 18%, #000, transparent 80%); animation: gridMove 12s linear infinite; }
.bgfx i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; opacity: var(--orb); will-change: transform; }
.bgfx i:first-child { left: -20vmax; top: -26vmax; background: radial-gradient(circle, var(--g2), transparent 62%); animation: drift 24s ease-in-out infinite alternate; }
.bgfx i:last-child { right: -24vmax; bottom: -30vmax; background: radial-gradient(circle, var(--g1), transparent 62%); animation: drift 30s ease-in-out infinite alternate-reverse; }

.intro { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
.intro .cl { position: absolute; opacity: 0; animation-duration: 1.5s; animation-timing-function: cubic-bezier(.6, 0, .2, 1); animation-fill-mode: forwards; }
.intro .h { left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--cy), transparent); animation-name: introH; }

    });

  function deviceToken() {

  /* Реальные данные. На своём хостинге: прогнозы Open-Meteo и файлы stats.json / markets.json от бота. */
  function loadLive() {
    var ctrl = window.AbortController ? new AbortController() : null, to = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + CITIES.map(function (c) { return c.lat; }).join(",") + "&longitude=" + CITIES.map(function (c) { return c.lon; }).join(",") + "&daily=temperature_2m_max&models=" + MODELS.map(function (m) { return m.key; }).join(",") + "&forecast_days=" + DAYS + "&timezone=auto";
    return fetch(url, ctrl ? { signal: ctrl.signal } : {}).then(function (r) { clearTimeout(to); if (!r.ok) throw new Error("http"); return r.json(); }).then(function (j) {
      var arr = Array.isArray(j) ? j : [j], data = {}, ok = 0;
      CITIES.forEach(function (c, i) {
        var o = arr[i]; if (!o || !o.daily) return;
        var m = MODELS.map(function (md) { var a = o.daily["temperature_2m_max_" + md.key]; return a ? a.map(function (v) { return v == null ? NaN : v; }) : []; });
        if (m.filter(function (a) { return a.length >= DAYS; }).length >= 2) { data[c.id] = m.map(function (a) { return a.length >= DAYS ? a : new Array(DAYS).fill(NaN); }); ok++; }
      });
      if (ok < CITIES.length) throw new Error("incomplete");
      state.dates = arr[0].daily.time.map(function (s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); });
      state.data = data; state.source = "live"; state.updated = new Date(); renderAll();
    });
  }
  try { loadLive().catch(function () {}); } catch (e) {}
  /* живые рынки Polymarket, которые раз в 6 часов записывает collect.py */
  try {
    fetch("data/markets.json").then(function (r) { if (!r.ok) throw new Error("no"); return r.json(); }).then(function (j) {
      var list = (j.markets || []).filter(function (m) { return cityById(m.c) && m.b && m.b.length; });
      if (!list.length) return;
      MARKETS.length = 0; list.forEach(function (m) { MARKETS.push(m); });
      state.shifted = 0; state.marketsLive = true;
      var u = new Date(j.updated); if (!isNaN(u)) SNAP = new Intl.DateTimeFormat("ru", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(u);
      if (state.source === "demo") { var dm = makeDemo(); state.dates = dm.dates; state.data = dm.data; }
      renderTicker(); renderAll();
    }).catch(function () {});
  } catch (e) {}
  try {
    fetch("data/stats.json").then(function (r) { if (!r.ok) throw new Error("no"); return r.json(); }).then(function (j) {
      state.stats = j.map(function (r) { var d = new Date(r.date), age = Math.round((today0() - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5); return { dt: d, c: r.city, k: r.k, p: r.p, actual: r.actual, hit: r.hit, age: age }; }); state.statsSource = "live"; if (state.view === "report") renderReport();
    }).catch(function () {});
  } catch (e) {}
})();
</script>
